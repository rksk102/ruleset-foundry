name: "安全扫描"

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  osv-scanner:
    name: "OSV 依赖漏洞扫描"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "Run scanner"
        id: scan
        uses: docker://ghcr.io/google/osv-scanner-action@sha256:3fa25659351c9a5527b30d73b6f3c2ee0bcac106d6220948211d87379d08f243  # v2.7.1
        continue-on-error: true
        env:
          GOTOOLCHAIN: auto
        with:
          args: |-
            --output=results.json
            --format=json
            --lockfile=uv.lock
            --config=osv-scanner.toml
      # 镜像入口可能把零包的退出码转为成功，reporter 也会把无法读取的输入当作空结果。
      - name: "Check that the scan completed"
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def reject_constant(value):
              raise ValueError(f"Invalid JSON number: {value}")

          try:
              output = json.loads(Path("results.json").read_text(encoding="utf-8"), parse_constant=reject_constant)
              if not isinstance(output, dict) or not isinstance(output.get("results"), list):
                  raise ValueError("Expected a results array")
          except (OSError, ValueError, RecursionError):
              print("::error::OSV-Scanner did not produce valid results.json. See the Run scanner step.")
              raise SystemExit(1)
          PY
      - name: "Run osv-scanner-reporter"
        uses: docker://ghcr.io/google/osv-scanner-action@sha256:3fa25659351c9a5527b30d73b6f3c2ee0bcac106d6220948211d87379d08f243  # v2.7.1
        with:
          entrypoint: /root/osv-reporter
          args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true
      - name: "Upload artifact"
        id: upload_artifact
        if: "${{ !cancelled() }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: OSV Scanner SARIF file
          path: results.sarif
          retention-days: 5
      - name: "Upload to code-scanning"
        if: "${{ !cancelled() }}"
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: results.sarif
      - name: "Print Code Scanning URL"
        if: "${{ !cancelled() }}"
        run: |
          echo "View the OSV-Scanner results in the 'Security' tab of this repository."
          echo "${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=is%3Aopen+branch:${GITHUB_REF_NAME}+tool%3Aosv-scanner"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: "Error troubleshooter"
        if: "${{ always() && steps.upload_artifact.outcome == 'failure' }}"
        run: |
          echo "::error::Artifact upload failed. This may be a result of an error from the scanning step."
          exit 1
