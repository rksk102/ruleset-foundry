name: "安全扫描"

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  osv-scanner:
    name: "OSV 依赖漏洞扫描"
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932  # v2.7.1
    with:
      scan-args: |-
        --lockfile=uv.lock
        --config=osv-scanner.toml
      fail-on-vuln: true
      upload-sarif: true
