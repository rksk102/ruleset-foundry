name: "CI"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-generated-artifacts:
    name: "禁止提交生成产物"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Python 环境
        uses: ./.github/actions/setup-python-env
      - name: 检查生成产物是否被跟踪
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          # 产物目录必须从配置派生，避免 rulesets_dir/log_dir 自定义后门禁漏检
          mapfile -t GENERATED_DIRS < <(python - <<'PY'
          from config_loader import get

          for path in (
              get("paths", "rulesets_dir", default="rulesets"),
              get("paths", "merged_output_dir", default="merged-rules"),
              get("paths", "mrs_output_dir", default="merged-rules-mrs"),
              get("paths", "log_dir", default="logs"),
              get("mihomo", "kernel_cache_path", default=".cache/mihomo-kernel"),
          ):
              print(path)
          PY
          )
          if [ "${#GENERATED_DIRS[@]}" -ne 5 ]; then
            echo "::error::无法从配置派生生成产物路径"
            exit 1
          fi
          tracked=$(git ls-files -- "${GENERATED_DIRS[@]/%//*}")
          if [ -n "$tracked" ]; then
            echo "::error::生成产物不得进入 git（${GENERATED_DIRS[*]}）。"
            echo "$tracked" | head -20
            exit 1
          fi
          echo "OK: 产物未被跟踪（${GENERATED_DIRS[*]}）"
      - name: 检查被忽略的跟踪文件
        run: |
          set -euo pipefail
          tracked=$(git ls-files -ci --exclude-standard)
          if [ -n "$tracked" ]; then
            echo "::error::被忽略的文件不得通过 git add -f 等方式进入跟踪。"
            echo "$tracked" | head -20
            exit 1
          fi
          echo "OK: 没有被忽略的跟踪文件"
      - name: 获取变更提交范围
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "::error::无法确定变更起点。"
            exit 1
          fi
          fetch_ref="$GITHUB_REF"
          if [ -n "$PR_NUMBER" ]; then
            fetch_ref="refs/pull/${PR_NUMBER}/head"
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git fetch --no-tags --depth=2 origin "$fetch_ref"
          for _ in {1..16}; do
            if git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null; then
              exit 0
            fi
            git fetch --no-tags --deepen=64 origin "$BASE_SHA"
            git fetch --no-tags --deepen=64 origin "$fetch_ref"
          done
          echo "::error::无法建立完整变更范围（约 1024 个提交上限），请拆分或同步分支。"
          exit 1
      - name: 检查新增提交中的大文件
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          object_sizes="$(
            git rev-list --objects "${BASE_SHA}..${HEAD_SHA}" |
              cut -d' ' -f1 |
              git cat-file --batch-check='%(objectname) %(objecttype) %(objectsize)'
          )"
          if [ -z "$object_sizes" ]; then
            echo "OK: 没有新增对象"
            exit 0
          fi
          oversized=0
          while read -r oid type size; do
            if [[ "$type" == "blob" ]] && (( size > 1048576 )); then
              echo "::error::新增 Blob 超过 1 MiB：$oid（$size 字节）"
              oversized=1
            fi
          done <<< "$object_sizes"
          if (( oversized )); then
            exit 1
          fi
          echo "OK: 新增 Blob 均不超过 1 MiB"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Python 环境
        uses: ./.github/actions/setup-python-env
      - run: ruff check scripts tests
      - name: zizmor（工作流安全审计）
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity medium .github/

  workflows-lint:
    name: "工作流静态检查"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667  # v1.7.12
        with:
          args: -color

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Python 环境
        uses: ./.github/actions/setup-python-env
      - name: pytest（覆盖率门禁 ≥70%）
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python -m pytest tests/ -q --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=70

  kernel-smoke:
    name: "内核冒烟"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Python 环境
        uses: ./.github/actions/setup-python-env
      - name: 计算内核缓存键
        id: kernel-key
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          from config_loader import get
          from convert_mrs import current_kernel_arch

          raw = "|".join(
              str(get("mihomo", key, default=""))
              for key in ("pinned_version", "kernel_sha256", "kernel_sha256_arm64")
          )
          print("key=" + hashlib.sha256(raw.encode("utf-8")).hexdigest())
          print("path=" + get("mihomo", "kernel_cache_path", default=".cache/mihomo-kernel"))
          print("arch=" + current_kernel_arch())
          PY
      - name: 恢复 Mihomo 内核缓存
        id: kernel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.kernel-key.outputs.path }}
          key: mihomo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.kernel-key.outputs.key }}
          restore-keys: |
            mihomo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.kernel-key.outputs.key }}-
            mihomo-${{ runner.os }}-${{ runner.arch }}-${{ steps.kernel-key.outputs.key }}
            mihomo-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: 校验当前内核可运行
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/convert_mrs.py --verify-current-kernel
      - name: 用缓存内核转换最小 ipcidr 输入
        env:
          KERNEL: ${{ steps.kernel-key.outputs.path }}/${{ steps.kernel-key.outputs.arch }}/mihomo
        run: |
          set -euo pipefail
          TMP_DIR="${RUNNER_TEMP}/kernel-smoke"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"
          printf '1.1.1.0/24\n172.16.0.0/12\n' > "$TMP_DIR/ipcidr.txt"
          "$KERNEL" convert-ruleset ipcidr text "$TMP_DIR/ipcidr.txt" "$TMP_DIR/ipcidr.mrs"
          test -s "$TMP_DIR/ipcidr.mrs"
          echo "OK: ipcidr 转换产物非空（$(stat -c%s "$TMP_DIR/ipcidr.mrs") 字节）"

  dependency-review:
    name: "依赖审查"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
