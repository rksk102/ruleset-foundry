name: "Dependabot 自动合并"

on:  # zizmor: ignore[dangerous-triggers] 仅调用 gh pr merge，不检出/执行不受信代码
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}  # 默认收回全部权限，仅在本 job 显式申明所需写权限

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # 合并 PR 需要
      pull-requests: write  # 读取 PR 元数据并触发合并
    steps:
      - name: 合并 Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ -z "${HEAD_SHA:-}" ]; then
            echo "::error::workflow_run.head_sha 为空，拒绝在没有 SHA 绑定的情况下合并"
            exit 1
          fi

          # 仅自动合并既有非 major version-update 分组的分支；分组名必须与
          # .github/dependabot.yml 中 update-types 不含 major 的分组保持一致。
          # 安全更新不会进入这些 version-update 分组，未分组/无法识别的分支
          # 名也一律转人工审核（不依赖分支名里的 major 字样做判断）。
          ALLOWED_GROUPS="python-dependencies github-actions"

          if [[ ! "$HEAD_BRANCH" =~ ^dependabot/[^/]+/[^/]+$ ]]; then
            echo "非 Dependabot 分组分支（$HEAD_BRANCH），转人工审核"
            exit 0
          fi

          case "$HEAD_BRANCH" in
            *-major*)
              echo "大版本分组（$HEAD_BRANCH）需人工审核，跳过自动合并"
              exit 0
              ;;
          esac

          LEAF="${HEAD_BRANCH##*/}"
          GROUP_OK=0
          for group in $ALLOWED_GROUPS; do
            if [ "$LEAF" = "$group" ]; then
              GROUP_OK=1
              break
            fi
            # 分组分支可能带依赖 Dependabot 的十六进制去重后缀；
            # major 分组名（*-major）不会命中该后缀形态。
            if [[ "$LEAF" =~ ^${group}-[0-9a-f]{4,40}$ ]]; then
              GROUP_OK=1
              break
            fi
          done
          if [ "$GROUP_OK" -ne 1 ]; then
            echo "分支（$HEAD_BRANCH）不属于明确的非 major version-update 分组，转人工审核"
            exit 0
          fi

          pr="$PR_NUMBER"
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" \
                   --state open --json number --jq '.[0].number // empty')
          fi
          if [ -z "$pr" ]; then
            echo "未找到对应的开放 PR，跳过"; exit 0
          fi

          read -r author state < <(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" \
            --json author,state --jq '"\(.author.login) \(.state)"')
          if [ "$author" != "app/dependabot" ] && [ "$author" != "dependabot[bot]" ]; then
            echo "PR #$pr 作者为 $author，非 Dependabot，跳过"; exit 0
          fi
          if [ "$state" != "OPEN" ]; then
            echo "PR #$pr 状态为 $state，无需合并"; exit 0
          fi

          echo "CI 已通过（head_sha=$HEAD_SHA），合并 PR #$pr"
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --auto --merge \
            --match-head-commit "$HEAD_SHA"
